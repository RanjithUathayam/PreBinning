<ion-header>
    <ion-toolbar>
      <app-pageheader [title]="'EMPTY BIN'"></app-pageheader>
    </ion-toolbar>
  </ion-header>
  
  <ion-content>
    <div class="container-fluid p-2">
      <div class="row pt-3">
        <div class="col-12">
          <!-- Scan Empty Bin Section -->
          <div class="col-12 p-0 mt-2">
            <div class="d-flex align-items-center">
              <label class="text-color font-weight-bold">Scan Empty Bin</label>
            </div>
  
            <!-- Input Field Section -->
            <div class="scan_bin pt-3 col-12 pl-0">
              <div class="input-border-custom input_style">
                <input 
                id="ip"
                #inputField
                [disabled]="isInputDisabled"
                class="form-control input-border-custom smaller-text"
                style="--placeholder-font-size: 1.4em;" />
              </div>
  
              <!-- QR Code Icon -->
              <div>
                <span class="input-icon input_style1">
                  <ion-icon name="qr-code" class="qrcode-icon qr_icon"></ion-icon>
                </span>
              </div>
            </div>
          </div>
  
          <!-- Submit Button -->
          <div class="mt-5">
            <div class="row">
              <div class="col-md-6 col-sm-6 col-6">
                <button class="btn btn-style" (click)="handleClear()">Clear</button>
              </div>
              <div class="col-md-6 col-sm-6 col-6 d-flex align-items-center justify-content-end">
                <button class="btn btn-style" (click)="handleSubmit()">Submit</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ion-content>
